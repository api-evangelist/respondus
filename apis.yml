name: Respondus
kind: company
description: Respondus builds assessment-integrity tools for online exams - most
  notably LockDown Browser, a custom browser that locks down the testing environment,
  and Respondus Monitor, an automated webcam-based online proctoring service that
  adds AI-assisted review on top of LockDown Browser. Over 2,000 institutions across
  50+ countries use Respondus to deliver hundreds of millions of online exams a
  year. Respondus does not publish a self-service public developer API. Its products
  reach learning platforms through LMS integration rather than an open REST surface -
  native plugins/building blocks plus the IMS Global LTI (Learning Tools
  Interoperability) standard for Blackboard, Brightspace, Canvas, Moodle, Sakai, and
  Schoology, and a privately-licensed LockDown Browser SDK for third-party assessment
  platforms that must be arranged through Respondus sales. No public OpenAPI,
  developer keys, or documented endpoints are offered.
